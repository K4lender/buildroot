image boot.vfat {
	vfat {
		files = {
			"tiboot3.bin",
			"tispl.bin",
			"u-boot.img",
			"Image",
			"k3-am67a-t3-gem-o1.dtb",
			"uEnv.txt"
		}
	}
	size = 64M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
		offset = 4M
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
